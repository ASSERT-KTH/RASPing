name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: astral-sh/setup-uv@e92bafb6253dcd438e0484186d7669ea7a8ca1cc # v6.4.3
      - name: Install (CPU JAX, locked versions)
        run: uv sync --locked
      - name: Fast tests (paper numbers, analysis, golden equivalence, unit tests)
        run: uv run pytest -q
      - name: Slow tests (compile every mutant)
        if: github.event_name == 'pull_request'
        run: uv run pytest -q --slow tests/test_raspbugs.py
